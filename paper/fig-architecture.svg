<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    .box { fill:#fff; stroke:#999; stroke-width:1; rx:4; }
    .stage { fill:#FEF3E2; stroke:#D97706; stroke-width:1.1; }
    .lbl { font-size:11px; fill:#222; }
    .sub { font-size:9px; fill:#777; }
    .flow { stroke:#666; stroke-width:1.2; fill:none; marker-end:url(#arr); }
    .grp { font-size:9.5px; fill:#92400E; font-weight:600; letter-spacing:0.4px; }
  </style>

  <!-- client -->
  <rect x="8" y="120" width="82" height="46" rx="4" class="box"/>
  <text x="49" y="140" text-anchor="middle" class="lbl">Client</text>
  <text x="49" y="153" text-anchor="middle" class="sub">Anthropic or</text>
  <text x="49" y="163" text-anchor="middle" class="sub">OpenAI wire</text>

  <line x1="90" y1="143" x2="122" y2="143" class="flow"/>

  <!-- admission pipeline group -->
  <rect x="124" y="66" width="118" height="168" rx="6" fill="#FFFBF4" stroke="#E5C89B" stroke-dasharray="3 3"/>
  <text x="183" y="58" text-anchor="middle" class="grp">ADMISSION</text>
  <g>
    <rect x="132" y="76" width="102" height="26" rx="4" class="stage"/>
    <text x="183" y="93" text-anchor="middle" class="lbl">auth (key)</text>
    <rect x="132" y="114" width="102" height="26" rx="4" class="stage"/>
    <text x="183" y="131" text-anchor="middle" class="lbl">rate limit</text>
    <rect x="132" y="152" width="102" height="26" rx="4" class="stage"/>
    <text x="183" y="169" text-anchor="middle" class="lbl">billing gate</text>
    <rect x="132" y="190" width="102" height="34" rx="4" class="stage"/>
    <text x="183" y="204" text-anchor="middle" class="lbl">model policy</text>
    <text x="183" y="217" text-anchor="middle" class="sub">+ spend budgets</text>
  </g>

  <line x1="242" y1="143" x2="278" y2="143" class="flow"/>

  <!-- router -->
  <rect x="280" y="106" width="122" height="74" rx="4" class="box" stroke="#D97706" stroke-width="1.4"/>
  <text x="341" y="126" text-anchor="middle" class="lbl" font-weight="600">router</text>
  <text x="341" y="141" text-anchor="middle" class="sub">tag → candidate list</text>
  <text x="341" y="153" text-anchor="middle" class="sub">availability-aware</text>
  <text x="341" y="165" text-anchor="middle" class="sub">first served wins</text>

  <line x1="402" y1="143" x2="438" y2="143" class="flow"/>

  <!-- adapters -->
  <rect x="440" y="58" width="108" height="170" rx="6" fill="#FFFBF4" stroke="#E5C89B" stroke-dasharray="3 3"/>
  <text x="494" y="50" text-anchor="middle" class="grp">ADAPTERS</text>
  <g>
    <rect x="448" y="68" width="92" height="26" rx="4" class="box"/>
    <text x="494" y="85" text-anchor="middle" class="lbl">anthropic</text>
    <rect x="448" y="104" width="92" height="26" rx="4" class="box"/>
    <text x="494" y="121" text-anchor="middle" class="lbl">openai</text>
    <rect x="448" y="140" width="92" height="26" rx="4" class="box"/>
    <text x="494" y="157" text-anchor="middle" class="lbl">google</text>
    <rect x="448" y="176" width="92" height="26" rx="4" class="box"/>
    <text x="494" y="193" text-anchor="middle" class="lbl">bedrock</text>
  </g>
  <text x="494" y="222" text-anchor="middle" class="sub">circuit breakers</text>

  <line x1="548" y1="143" x2="584" y2="143" class="flow"/>

  <!-- provider -->
  <rect x="586" y="120" width="126" height="46" rx="4" class="box"/>
  <text x="649" y="140" text-anchor="middle" class="lbl">provider edge</text>
  <text x="649" y="155" text-anchor="middle" class="sub">first-party API, SSE</text>

  <!-- post-response strip -->
  <line x1="341" y1="180" x2="341" y2="248" class="flow"/>
  <rect x="180" y="250" width="330" height="40" rx="4" fill="#F6F3EC" stroke="#bbb"/>
  <text x="345" y="266" text-anchor="middle" class="lbl">post-response (off the hot path)</text>
  <text x="345" y="281" text-anchor="middle" class="sub">CU metering · usage ledger · cache/TTFT stats · optional payload capture</text>
</svg>
